<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Duebrief</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet" />
    <!--APP_CSS-->
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div class="brand">Duebrief</div>
        <div>
          <time id="clock"></time>
          <span class="mode" id="mode-label"></span>
          <span class="mode" id="count"></span>
        </div>
      </header>

      <!--DEMO_BANNER-->

      <section class="next">
        <div class="label">Start this</div>
        <h1 id="next-title">Loading</h1>
        <p class="why" id="next-why"></p>
      </section>

      <div class="toolbar">
        <button type="button" id="print-today">Print tonight</button>
        <button type="button" id="print-week">Print week</button>
        <button type="button" id="export">Export JSON</button>
        <label id="import-label" class="demo-lock">
          Import CSV
          <input id="import" type="file" accept=".csv,.json,text/csv,application/json" hidden />
        </label>
      </div>
      <p id="demo-lock" class="demo-lock" hidden>
        Try-out is one Tuesday (5 Upcoming items). Delete one, or buy the file to import your own Schoology dump.
      </p>

      <div class="grid" id="lists">
        <div>
          <h2>Overdue</h2>
          <div id="overdue-list"></div>
          <h2 style="margin-top: 28px">Due in 48 hours</h2>
          <div id="soon-list"></div>
          <h2 style="margin-top: 28px">Whole dump</h2>
          <div id="all-list"></div>
        </div>
        <div>
          <h2>Paste Upcoming</h2>
          <form class="add" id="paste-form">
            <label>
              title,course,due,points,type,difficulty
              <textarea
                name="paste"
                rows="6"
                placeholder="Unit 3 test,Physics,2026-09-18,100,test,5"
              ></textarea>
            </label>
            <button class="primary" type="submit">Rank this dump</button>
          </form>
          <h2 style="margin-top: 28px">Or add one assignment</h2>
          <form class="add" id="add-form">
            <label>
              Title
              <input name="title" required maxlength="160" placeholder="Unit 3 test" />
            </label>
            <label>
              Course
              <input name="course" maxlength="80" placeholder="Physics" />
            </label>
            <label>
              Due
              <input name="due" type="datetime-local" required />
            </label>
            <div class="row">
              <label>
                Points
                <input name="points" type="number" min="0" max="1000" step="1" placeholder="100" />
              </label>
              <label>
                Type
                <select name="type">
                  <option value="test">Test</option>
                  <option value="project">Project / DBQ</option>
                  <option value="quiz">Quiz</option>
                  <option value="homework">Homework</option>
                  <option value="other">Other</option>
                </select>
              </label>
            </div>
            <label>
              Difficulty (1 easy – 5 brutal)
              <select name="difficulty">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3" selected>3</option>
                <option value="4">4</option>
                <option value="5">5</option>
              </select>
            </label>
            <button class="primary" type="submit">Add to Upcoming</button>
          </form>
        </div>
      </div>
    </div>
    <!--APP_JS-->
  </body>
</html>
